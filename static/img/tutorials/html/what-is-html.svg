<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E1E38"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glowGrad" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E44D26" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- HTML Brand Gradient -->
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#E44D26"/>
    </linearGradient>

    <!-- Sub Brand Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Code Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Code Window Dots -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="850" cy="200" r="450" fill="url(#glowGrad)"/>

  <!-- Decorative Circuit Lines / HTML Tags in Background -->
  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <path d="M 100 100 H 400 L 450 150 V 300"/>
    <path d="M 1100 500 H 900 L 850 450 V 300"/>
    <circle cx="450" cy="150" r="4" fill="#334155"/>
    <circle cx="850" cy="450" r="4" fill="#334155"/>
  </g>

  <!-- Left Content Area (Headings & Badges) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Branding / Tag -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="#38BDF8"/>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="0.5">HTML5 TUTORIAL</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 210)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" fill="#FFFFFF" letter-spacing="-1">
        What is <tspan fill="url(#htmlGrad)">HTML</tspan>?
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 270)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94A3B8" width="500">
        The Foundational Building Block of the Web
      </text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="18" fill="#64748B">
        Learn structure, elements, tags, and modern web standards.
      </text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 370)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="140" height="42" rx="8" fill="#1E293B" stroke="#E44D26" stroke-width="1" stroke-opacity="0.4"/>
        <text x="16" y="26" font-family="Fira Code, monospace" font-size="14" font-weight="600" fill="#FF6B4A">&lt;structure&gt;</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(152, 0)">
        <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="16" y="26" font-family="Fira Code, monospace" font-size="14" font-weight="600" fill="#60A5FA">&amp;elements;</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(294, 0)">
        <rect x="0" y="0" width="120" height="42" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
        <text x="16" y="26" font-family="Fira Code, monospace" font-size="14" font-weight="600" fill="#34D399">SEO-Ready</text>
      </g>
    </g>

    <!-- Author / Footer Attribution -->
    <g transform="translate(0, 485)">
      <line x1="0" y1="0" x2="420" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#F8FAFC">
        CodeHarborHub
      </text>
      <text x="140" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#64748B">
        • Comprehensive Guide
      </text>
    </g>
  </g>

  <!-- Right Visual Area (Code Window + HTML Shield) -->
  <g transform="translate(620, 90)" filter="url(#shadow)">

    <!-- Code Editor Card -->
    <rect x="0" y="0" width="500" height="430" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 484 0 C 492.837 0 500 7.163 500 16 L 500 44 L 0 44 Z" fill="#0F172A"/>
    <line x1="0" y1="44" x2="500" y2="44" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="22" r="6" fill="#EF4444"/>
    <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="22" r="6" fill="#10B981"/>
    
    <text x="250" y="26" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#64748B">index.html</text>

    <!-- Code Snippet -->
    <g transform="translate(30, 75)" font-family="Fira Code, Consolas, Monaco, monospace" font-size="15" font-weight="500" xml:space="preserve">
      <!-- Line 1 -->
      <text x="0" y="0">
        <tspan fill="#64748B">1 </tspan>
        <tspan fill="#475569">&lt;!</tspan><tspan fill="#F43F5E">DOCTYPE</tspan> <tspan fill="#38BDF8">html</tspan><tspan fill="#475569">&gt;</tspan>
      </text>
      
      <!-- Line 2 -->
      <text x="0" y="30">
        <tspan fill="#64748B">2 </tspan>
        <tspan fill="#475569">&lt;</tspan><tspan fill="#F43F5E">html</tspan> <tspan fill="#38BDF8">lang</tspan><tspan fill="#E2E8F0">=</tspan><tspan fill="#F59E0B">"en"</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 3 -->
      <text x="0" y="60">
        <tspan fill="#64748B">3 </tspan>
        <tspan fill="#475569">  &lt;</tspan><tspan fill="#F43F5E">head</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 4 -->
      <text x="0" y="90">
        <tspan fill="#64748B">4 </tspan>
        <tspan fill="#475569">    &lt;</tspan><tspan fill="#F43F5E">title</tspan><tspan fill="#475569">&gt;</tspan><tspan fill="#F8FAFC">What is HTML?</tspan><tspan fill="#475569">&lt;/</tspan><tspan fill="#F43F5E">title</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 5 -->
      <text x="0" y="120">
        <tspan fill="#64748B">5 </tspan>
        <tspan fill="#475569">  &lt;/</tspan><tspan fill="#F43F5E">head</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 6 -->
      <text x="0" y="150">
        <tspan fill="#64748B">6 </tspan>
        <tspan fill="#475569">  &lt;</tspan><tspan fill="#F43F5E">body</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 7 -->
      <text x="0" y="180">
        <tspan fill="#64748B">7 </tspan>
        <tspan fill="#475569">    &lt;</tspan><tspan fill="#F43F5E">h1</tspan><tspan fill="#475569">&gt;</tspan><tspan fill="#38BDF8">Hello World!</tspan><tspan fill="#475569">&lt;/</tspan><tspan fill="#F43F5E">h1</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 8 -->
      <text x="0" y="210">
        <tspan fill="#64748B">8 </tspan>
        <tspan fill="#475569">    &lt;</tspan><tspan fill="#F43F5E">p</tspan><tspan fill="#475569">&gt;</tspan><tspan fill="#94A3B8">Building the web...</tspan><tspan fill="#475569">&lt;/</tspan><tspan fill="#F43F5E">p</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 9 -->
      <text x="0" y="240">
        <tspan fill="#64748B">9 </tspan>
        <tspan fill="#475569">  &lt;/</tspan><tspan fill="#F43F5E">body</tspan><tspan fill="#475569">&gt;</tspan>
      </text>

      <!-- Line 10 -->
      <text x="0" y="270">
        <tspan fill="#64748B">10</tspan>
        <tspan fill="#475569">&lt;/</tspan><tspan fill="#F43F5E">html</tspan><tspan fill="#475569">&gt;</tspan>
      </text>
    </g>

    <!-- Floating 3D-Style HTML Shield Icon -->
    <g transform="translate(350, 240)" filter="url(#glow)">
      <!-- Shield Outer Background -->
      <polygon points="0,0 110,0 100,125 55,140 10,125" fill="#E44D26"/>
      <!-- Shield Right Darker Shade -->
      <polygon points="55,10 100,10 92,115 55,127" fill="#F16529"/>
      <!-- HTML5 "5" Digit Graphic -->
      <polygon points="25,30 85,30 82,55 40,55 42,75 80,75 75,105 55,112 35,105 33,90 48,90 50,96 55,98 62,96 64,88 28,88" fill="#FFFFFF"/>
    </g>

  </g>
</svg>
